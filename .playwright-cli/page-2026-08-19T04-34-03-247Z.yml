              - paragraph [ref=f1e345]
              - paragraph [ref=f1e346]:
                - strong [ref=f1e347]: THE OFFICIAL GAME OF THE FIA WORLD ENDURANCE CHAMPIONSHIP
              - paragraph [ref=f1e348]: Le Mans Ultimate is the official game of the FIA World Endurance Championship and 24 Hours of Le Mans. Play out the exciting new era for sportscar racing in unparalleled detail. Le Mans Ultimate offers an immersive game for both seasoned sim racers and those new to the sport and genre, growing and evolving with the real-life FIA WEC series.
              - paragraph [ref=f1e349]
              - paragraph [ref=f1e350]:
                - button [ref=f1e354]:
                  - img "Pause animation" [ref=f1e355]
              - paragraph [ref=f1e356]
              - paragraph [ref=f1e357]:
                - strong [ref=f1e358]: INCREDIBLE CARS FROM SPORTSCAR RACING
                - text: Drive the officially licensed manufacturer Hypercars from the incredible 2023 centenary season in the included base game content. Recreate tantalising on track battles between Toyota, Ferrari, Porsche, Cadillac, Peugeot, Glickenhaus and Vanwall.
              - paragraph [ref=f1e359]: Alongside the Hypercars comes a competitive array of classes. Lock horns in wheel-to-wheel LMP2 competition as well as the ultra-close, thunderous GTE cars. Drive for supremacy for famous brands such as Aston Martin, Corvette, Ferrari and Porsche.
              - paragraph [ref=f1e360]: 3 LMGT3 cars from the 2024 and 2025 season (Mercedes AMG Evo, Ford Mustang and McLaren 720 Evo) have been added to the base game along with the incredible Adrian Newey designed Aston Martin Valkyrie AMR LMH with its ear-splitting V12.
              - paragraph [ref=f1e361]:
                - text: 19 cars are available in the base game with over 200 different livery variations.
                - strong [ref=f1e362]: LASER-SCANNED LEGENDARY CIRCUITS
                - text: "Enjoy the pulsating challenge of racing around some of the most revered circuits in the world including the seven destinations on the 2023 FIA WEC calendar in the base game: Autodromo Nazionale Monza, Circuit de Spa-Francorchamps, Sebring International Raceway, Bahrain International Circuit, Algarve International Circuit (Portimão), Fuji Speedway and the legendary – Circuit de la Sarthe in Le Mans – the playground for the ultimate racing experience."
              - paragraph [ref=f1e363]
              - paragraph [ref=f1e364]:
                - button [ref=f1e368]:
                  - img "Pause animation" [ref=f1e369]
              - paragraph [ref=f1e370]
              - paragraph [ref=f1e371]:
                - strong [ref=f1e372]: DRIVERS... START, YOUR ENGINES!
              - paragraph [ref=f1e373]: Experience the best of American road racing with the latest track DLC! 6 tracks, 3 individual packs or 1 track pass with all content included.
              - paragraph [ref=f1e374]:
                - strong [ref=f1e375]: US Track Pack 1 OUT NOW
                - text: "- including WeatherTech Raceway Laguna Seca & Daytona International Speedway"
              - paragraph [ref=f1e376]
              - paragraph [ref=f1e377]:
                - button [ref=f1e381]:
                  - img "Pause animation" [ref=f1e382]
              - paragraph [ref=f1e383]
              - paragraph [ref=f1e384]:
                - strong [ref=f1e385]: "NOW AVAILABLE: 2024 SEASON CONTENT"
              - paragraph [ref=f1e386]: Get the latest content from the 2024 FIA WEC season - available as individual packs or as a bundle.
              - paragraph [ref=f1e387]: These packs add 7 additional LMGT3 cars, 3 Hypercars and 4 incredible circuits - Imola, Interlagos, COTA (Circuit of the Americas), Qatar (Lusail International Circuit)
              - paragraph [ref=f1e388]:
                - strong [ref=f1e389]
              - paragraph [ref=f1e390]:
                - button [ref=f1e394]:
                  - img "Pause animation" [ref=f1e395]
                - strong [ref=f1e396]
              - paragraph [ref=f1e397]:
                - strong [ref=f1e398]: INDUSTRY-LEADING PHYSICS MODEL
              - paragraph [ref=f1e399]: Le Mans Ultimate uses the industry leading physics and handling simulation DNA from pMotor 2.5 as used and further improved from rFactor2 – enabling the game to take on more advanced simulation techniques, such as hybrid units, whilst also become more accessible and user friendly to the community – removing barriers to entry while also maintaining the key core elements of sim racing.
              - paragraph [ref=f1e400]: Tyre dynamics are first-in-class, utilising an advanced “brush” model that accurately portrays slip angles and models advanced features such as vehicle “flat spots” that you can really feel.
              - paragraph [ref=f1e401]: For wheel users, the 400Hz physics engine is directly translated into force feedback, delivering a highly detailed and predictable feeling to your steering wheel with presets available directly collaborated on with a number of prominent equipment manufacturers.
              - paragraph [ref=f1e402]: The game also features improved in-game controller support as well as a selectable and customisable difficulty level – to allow the player to determine their own skill level with help for first timers allowing adjustable assists.
              - paragraph [ref=f1e403]
              - paragraph [ref=f1e404]:
                - strong [ref=f1e405]: DYNAMIC RACING EXPERIENCE
              - paragraph [ref=f1e406]: Realistic day and night cycles are a key element of this simulation with incredible lighting effects as you race into dusk, through night and again into dawn down the Mulsanne at over 200mph.
              - paragraph [ref=f1e407]: Le Mans Ultimate uses an advancement in Real Road 2.0 track evolution simulation found uniquely in Studio 397 titles. Like a real race session, the track will begin as a green, relatively gripless circuit at the start of a weekend and rubber in as more cars pass over the racing line – with cars moving the dust, dirt and marbles off-line.
              - paragraph [ref=f1e408]: Work has been undertaken in several areas, including the dynamic weather effects too, such as rainfall and debris on windscreens and more realistic flow of water and formation of puddles on the circuit.
              - paragraph [ref=f1e409]:
                - button [ref=f1e413]:
                  - img "Pause animation" [ref=f1e414]
              - paragraph [ref=f1e415]: The cars will also change throughout the race, and the build-up of dirt and debris will cover the car – giving it the authentic weathered, endurance look.
              - paragraph [ref=f1e416]:
                - button [ref=f1e420]:
                  - img "Pause animation" [ref=f1e421]
              - paragraph [ref=f1e422]
              - paragraph [ref=f1e423]:
                - strong [ref=f1e424]: MULTIPLAYER - COMPETE IN SKILL BASED EVENTS OR MANAGE YOUR OWN SERVER
              - paragraph [ref=f1e425]: For those looking for the edge of the seat, wheel-to-wheel competition against real-life drivers, the Online function, powered by RaceControl, will be home to that pulsating challenge. Racers are able to take part in ranked Daily, Weekly and Special Events that provide the opportunity to build the player’s Driver and Safety rankings. As the player unlocks higher ranked races and exclusive events when the game develops and grows alongside the real-life FIA World Endurance Championship.
              - paragraph [ref=f1e426]: Also available is player-controlled server hosting so users and leagues can configure their own experience, when they want it.
              - paragraph [ref=f1e427]: For the latest information & schedule on all online multiplayer, head to RaceControl.GG
              - paragraph [ref=f1e428]
              - paragraph [ref=f1e429]:
                - strong [ref=f1e430]: ULTIMATE RACE WEEKEND
                - text: Single Player fans can enjoy the Race Weekend feature which provides the perfect proving ground for racing against formidable AI opponents which customisable difficulty.
              - paragraph [ref=f1e431]: In this game mode players can define their race experience - adjusting the time of day, session duration and weather conditions to your liking. From there, you can refine your car set-up and race wheel-to-wheel taking part in Practice, Qualifying and the main Race.
              - paragraph [ref=f1e432]: Players can also save their Race Weekend at pitstops, allowing you to complete your endurance races when it is convenient to you.
              - paragraph [ref=f1e433]
              - paragraph [ref=f1e434]:
                - strong [ref=f1e435]: "PLAY TOGETHER: AROUND YOUR SCHEDULE [CO-OP MODE]"
              - paragraph [ref=f1e436]: An innovative co-operative mode has been added to the game, allowing you to race with your friends against the AI opponents at a time convenient to you.
              - paragraph [ref=f1e437]: This “play by mail” style game online game mode allows you to invite your friends to complete a race, at a difficulty level of each individual user’s choosing whilst also racing for supremacy on the leaderboards as each action on track awards you points.
